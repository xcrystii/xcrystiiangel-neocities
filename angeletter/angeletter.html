<!DOCTYPE html>
    <html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <title>ANGELETTER</title>
</head>
<body>
    
    <p style="font-family: oldschool; color: #fff8ff;">ο(=•ω＜=)ρ⌒☆ sign your name ! [anonymous by default]</p>
    <div class="paper">
    <div class="paper-content">
    <textarea spellcheck oninput="angeLetter = this.value" required="1" maxlength="320" placeholder="dear crystal ..."></textarea>
    </div>
    </div>
    <button id="submit" class="default">Submit</button>
    <p id="status" style="font-family: oldschool;"></p>
    <script src="angeletter.js"></script>
</body>
<style>
    @font-face {
        font-family: oldschool;
        src: url(https://dl.dropbox.com/scl/fi/h41dws5x4haw7zgw0yc1s/Px437_DOS-V_re_ANK24.ttf?rlkey=2b75apurgp4zrnd2xelqax6ru&st=gwq7wdnt&dl=0);
        }
        body {
        background: url('../imgs/bookshelf.png');
        margin: 40px 0 0;
        font-family: oldschool;
        }
        
        .paper {
        position: relative;
        width: 90%;
        max-width: 800px;
        min-width: 400px;
        height: 480px;
        margin: 0 auto;
        background: #fafafa;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,.3);
        overflow: hidden;
        }
        .paper:before {
        content: '';
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 60px;
        background: radial-gradient(#575450 6px, transparent 7px) repeat-y;
        background-size: 30px 30px;
        border-right: 3px solid #D44147;
        box-sizing: border-box;
        }
        
        .paper-content {
        position: absolute;
        top: 30px; right: 0; bottom: 30px; left: 60px;
        background: linear-gradient(transparent, transparent 28px, #91D1D3 28px);
        background-size: 30px 30px;
        }
        
        .paper-content textarea {
        width: 100%;
        max-width: 100%;
        height: 100%;
        max-height: 100%;
        line-height: 30px;
        padding: 0 10px;
        border: 0;
        outline: 0;
        background: transparent;
        color: rgb(10, 0, 66);
        font-family: oldschool;
        font-weight: bold;
        font-size: 18px;
        box-sizing: border-box;
        z-index: 1;
        }
        
        footer {
        margin-top: 30px;
        text-align: center;
        font-size: 12px;
        color: rgba(0,0,0,.6);
        }
        footer a {
        color: rgba(255,255,255,.8);
        }
</style>
